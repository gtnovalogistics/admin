<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O365 Authenticated App</title>
    <!-- Include Microsoft Authentication Library for JS (MSAL Browser v3) -->
    <script src="msal-browser.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; text-align: center; }
        .hidden { display: none; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; margin: 20px auto; }
        button { background-color: #0078d4; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #005a9e; }
        .logout-btn { background-color: #d83b01; }
        .logout-btn:hover { background-color: #a82e00; }
    </style>
</head>
<body>

    <img alt="gtnovalogistics" src="https://gtnovalogistics.com/resources/gtnova_caribconex_logo.jpeg" height="100px">

    <!-- Unauthenticated State -->
    <div id="unauthenticated-view" class="card">
        <p>Please sign in with your Office 365 / Microsoft account.</p>
        <button id="login-button">Sign In</button>
    </div>

    <!-- Authenticated State -->
    <div id="authenticated-view" class="card hidden">
        <h3>Hello, <span id="user-display-name">User</span>!</h3>
        <p><strong>Email:</strong> <span id="user-email"></span></p>
        <p><strong>Roles/Groups (Authorization):</strong></p>
        <div id="user-claims" style="text-align: left; background: #f4f4f4; padding: 10px; font-family: monospace;"></div>
        <br>
        <button id="logout-button" class="logout-btn">Sign Out</button>
    </div>

<script>
    // --- 1. Configuration ---
    const msalConfig = {
        auth: {
            clientId: "fba4efb2-7fe7-4855-b0d3-112d25735a00", 
            authority: "https://login.microsoftonline.com/fb840e89-254b-4400-b7a9-ea83dd2afb82", 
            redirectUri: "http://localhost:3000" 
        },
        cache: {
            cacheLocation: "sessionStorage", 
            storeAuthStateInCookie: false,
        }
    };

    // --- 2. Initialize MSAL Instance Variable ---
    let myMSALObj = null;
    let username = "";

    const loginRequest = {
        scopes: ["User.Read"],
        extraQueryParameters: { domain_hint: "gtnovalogistics.com" }
    };

    // --- 3. DOM Elements ---
    const loginButton = document.getElementById("login-button");
    const logoutButton = document.getElementById("logout-button");
    const unauthView = document.getElementById("unauthenticated-view");
    const authView = document.getElementById("authenticated-view");
    const userDisplayName = document.getElementById("user-display-name");
    const userEmail = document.getElementById("user-email");
    const userClaims = document.getElementById("user-claims");

    // --- 4. Core Logic Functions ---
    function handleResponse(response) {
        if (response !== null) {
            username = response.account.username;
            showWelcomeMessage(response.account);
        } else {
            selectAccount();
        }
    }

    function selectAccount() {
        const currentAccounts = myMSALObj.getAllAccounts();
        if (currentAccounts.length === 0) {
            // Show login view if no user session exists
            unauthView.classList.remove("hidden");
            authView.classList.add("hidden");
            return;
        } else {
            username = currentAccounts[0].username;
            showWelcomeMessage(currentAccounts[0]);
        }
    }

    function showWelcomeMessage(account) {
        unauthView.classList.add("hidden");
        authView.classList.remove("hidden");

        userDisplayName.innerText = account.name;
        userEmail.innerText = account.username;

        const claims = account.idTokenClaims;
        let authorizationHTML = "";

        if (claims && claims.roles) {
            authorizationHTML += `<strong>App Roles:</strong> ${claims.roles.join(', ')}<br>`;
        }
        if (claims && claims.groups) {
            authorizationHTML += `<strong>Security Groups (IDs):</strong> ${claims.groups.join(', ')}<br>`;
        }
        if (!claims || (!claims.roles && !claims.groups)) {
            authorizationHTML += `<em>No custom App Roles or Group claims found in token.</em>`;
        }

        userClaims.innerHTML = authorizationHTML;
    }

    // --- 5. Initialization & Event Listeners ---
    window.onload = async function() {
        try {
            // Instantiating the object only once
            myMSALObj = new msal.PublicClientApplication(msalConfig);
            await myMSALObj.initialize();
            
            // Handle redirect promises (handles token processing if landing back on page)
            const redirectResponse = await myMSALObj.handleRedirectPromise();
            if (redirectResponse) {
                handleResponse(redirectResponse);
            } else {
                selectAccount();
            }

            // Click listener for sign-in button
            loginButton.addEventListener("click", () => {
                myMSALObj.loginPopup(loginRequest)
                    .then(handleResponse)
                    .catch(error => {
                        console.error("Login failed: ", error);
                    });
            });

            // Click listener for sign-out button
            logoutButton.addEventListener("click", () => {
                const logoutRequest = {
                    account: myMSALObj.getAccountByUsername(username),
                    postLogoutRedirectUri: window.location.origin
                };
                myMSALObj.logoutPopup(logoutRequest);
            });

        } catch (error) {
            console.error("MSAL initialization failed: ", error);
        }
    };
</script>

</body>
</html>
